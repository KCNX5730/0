<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f3">
  <title>SUBWIN11 · Windows 11</title>

  <!-- Font Awesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ================================================================
       RESET & BASE
       ================================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --win-bg: #ffffff;
      --win-text: #1a1a1a;
      --win-text-dim: #555;
      --accent: #0067c0;
      --accent-glow: rgba(0, 103, 192, 0.35);
      --taskbar-h: 48px;
      --win-radius: 12px;
      --glass: rgba(243, 243, 243, 0.85); /* Light Taskbar */
      --border-light: rgba(0, 0, 0, 0.1);
      --tray-hover: rgba(0, 0, 0, 0.06);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #000;
      touch-action: none;
    }

    /* ================================================================
       LOADING SCREEN
       ================================================================ */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-logo {
      width: 90px;
      height: auto;
      margin-bottom: 44px;
      filter: drop-shadow(0 0 30px rgba(76, 194, 255, 0.25));
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ================================================================
       DESKTOP (Light Background)
       ================================================================ */
    .desktop {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background-image: url('https://raw.githubusercontent.com/notAperson535/Win11-HTML/c4289ccd494bea102381b6f0765c0d4fd802c9c3/img/backgroundlight.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: filter 0.3s ease;
    }

    .desktop.blurred {
      filter: blur(6px) brightness(0.9);
    }

    .desktop-surface {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* ================================================================
       DESKTOP ICONS (Recycle Bin, Edge)
       ================================================================ */
    .desktop-icons-container {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 5;
    }
    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80px;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      transition: background 0.1s;
    }
    .desktop-icon img { width: 50px; height: 50px; margin-bottom: 6px; object-fit: contain; }
    .desktop-icon span { font-size: 11px; text-align: center; line-height: 1.2; }
    .desktop-icon:hover { background: rgba(255,255,255,0.15); }
    .desktop-icon:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }

    /* ================================================================
       SELECTION HIGHLIGHTER
       ================================================================ */
    #selection-box {
      position: absolute;
      border: 1px solid #0078D7;
      background: rgba(0, 120, 215, 0.3);
      border-radius: 2px;
      display: none;
      z-index: 10;
      pointer-events: none;
    }

    /* ================================================================
       CONTEXT MENU
       ================================================================ */
    .context-menu {
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      padding: 6px;
      display: none;
      z-index: 500;
      min-width: 180px;
    }
    .context-item {
      padding: 8px 12px;
      font-size: 13px;
      color: #000;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .context-item:hover { background: rgba(0,0,0,0.06); }
    .context-item i { width: 16px; text-align: center; font-size: 14px; }

    /* ================================================================
       TASKBAR (White Theme)
       ================================================================ */
    .taskbar {
      position: relative;
      z-index: 100;
      height: var(--taskbar-h);
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(1.6);
      -webkit-backdrop-filter: blur(30px) saturate(1.6);
      border-top: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
    }

    /* Weather Widget on Taskbar Left */
    .weather-widget {
      position: absolute;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 100%;
      cursor: pointer;
      padding: 0 6px;
      border-radius: 4px;
      transition: background 0.12s;
    }
    .weather-widget:hover { background: var(--tray-hover); }
    .weather-widget img { width: 24px; height: 24px; }
    .weather-info {
      display: flex;
      flex-direction: column;
      color: #000;
      line-height: 1.2;
    }
    .weather-temp { font-size: 12px; font-weight: 600; }
    .weather-desc { font-size: 11px; opacity: 0.8; }

    .taskbar-center {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 100%;
    }

    .taskbar-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s, transform 0.08s;
      position: relative;
      touch-action: manipulation;
    }

    .taskbar-icon img { 
      width: 24px; 
      height: 24px; 
      object-fit: contain; 
    }
    
    /* Start button specific */
    .taskbar-icon[data-app="start"] img {
      width: 26px;
      height: 26px;
    }

    .taskbar-icon:hover { background: rgba(0,0,0,0.06); }
    .taskbar-icon:active { transform: scale(0.88); }

    .taskbar-icon.active-app::after {
      content: '';
      position: absolute;
      bottom: 1px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* ================================================================
       TASKBAR SEARCH BOX
       ================================================================ */
    .taskbar-search {
      display: flex;
      align-items: center;
      height: 34px;
      width: 240px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 17px;
      padding: 0 12px;
      gap: 8px;
      margin: 0 8px;
      cursor: text;
      transition: background 0.2s, border-color 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .taskbar-search:hover {
      background: #f9f9f9;
      border-color: rgba(0, 0, 0, 0.25);
    }
    
    /* Force Search Icon to be Black */
    .taskbar-search img {
      width: 16px;
      height: 16px;
      filter: brightness(0);
    }
    
    .taskbar-search input {
      background: transparent;
      border: none;
      outline: none;
      color: #000;
      font-size: 13px;
      width: 100%;
      font-family: inherit;
    }
    .taskbar-search input::placeholder {
      color: #666;
    }

    /* ================================================================
       SYSTEM TRAY
       ================================================================ */
    .taskbar-tray {
      position: absolute;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 2px;
      color: #000;
      font-size: 12px;
      cursor: default;
      height: 100%;
    }

    .tray-item {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 6px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
      gap: 4px;
    }

    .tray-item:hover { background: var(--tray-hover); }
    .tray-item:active { background: rgba(0,0,0,0.12); }

    /* Force ALL Tray Icons to be Black */
    .tray-item img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      filter: brightness(0);
    }

    /* Language Stacked Format */
    .lang-stacked {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.1;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #000;
    }
    .lang-stacked span:first-child { opacity: 1; }
    .lang-stacked span:last-child { opacity: 0.6; }

    /* Clock specific */
    .tray-clock {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding: 0 12px;
      cursor: pointer;
      border-radius: 4px;
      height: 36px;
      color: #000;
    }
    .tray-clock:hover { background: var(--tray-hover); }
    .tray-clock span {
      font-size: 11px; 
      font-weight: 400; 
      font-style: normal; 
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    /* ================================================================
       TRAY FLYOUT (Subitems) - Light Mode
       ================================================================ */
    .tray-flyout {
      position: fixed;
      bottom: calc(var(--taskbar-h) + 8px);
      right: 12px;
      width: 240px;
      background: rgba(243, 243, 243, 0.95);
      backdrop-filter: blur(30px) saturate(1.5);
      -webkit-backdrop-filter: blur(30px) saturate(1.5);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border: 1px solid rgba(0,0,0,0.1);
      z-index: 250;
      padding: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tray-flyout.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .flyout-title {
      font-size: 12px;
      font-weight: 600;
      color: #000;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .flyout-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 12px;
      color: #333;
      cursor: pointer;
      border-radius: 4px;
    }
    .flyout-row:hover { color: #000; background: rgba(0,0,0,0.05); }
    
    .flyout-row.active {
      color: var(--accent);
      font-weight: 600;
    }

    .settings-toggle {
      width: 38px; height: 20px; border-radius: 10px; background: #ccc;
      position: relative; cursor: pointer; transition: background 0.2s;
    }
    .settings-toggle.on { background: var(--accent); }
    .settings-toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      transition: transform 0.2s;
    }
    .settings-toggle.on::after { transform: translateX(18px); }

    /* ================================================================
       START MENU - Light Mode
       ================================================================ */
    .start-menu {
      position: fixed;
      bottom: calc(var(--taskbar-h) + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(18px);
      width: min(600px, 90vw);
      height: 580px;
      background: rgba(243, 243, 243, 0.95);
      backdrop-filter: blur(40px) saturate(1.5);
      -webkit-backdrop-filter: blur(40px) saturate(1.5);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      z-index: 200;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .start-menu.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .start-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 10px;
      font-weight: 600;
      color: #000;
      font-size: 14px;
    }

    .start-apps {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
      padding: 0 16px 16px;
      overflow-y: auto;
      align-content: start;
    }

    .start-app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 4px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
      color: #000;
      touch-action: manipulation;
    }

    .start-app-item:hover { background: rgba(0,0,0,0.05); }
    .start-app-item:active { background: rgba(0,0,0,0.1); transform: scale(0.93); }
    .start-app-item img { width: 30px; height: 30px; margin-bottom: 5px; object-fit: contain; }
    .start-app-item span { font-size: 11px; text-align: center; line-height: 1.2; }

    /* ================================================================
       WINDOW - Light Mode
       ================================================================ */
    .window {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.94);
      width: min(840px, 92vw);
      height: min(560px, 74vh);
      background: #ffffff;
      border-radius: var(--win-radius);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      z-index: 300;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .window.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .window-header {
      height: 38px;
      background: #f3f3f3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 0 14px;
      border-bottom: 1px solid #e0e0e0;
      cursor: grab;
      flex-shrink: 0;
    }
    .window-header:active { cursor: grabbing; }

    .window-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #000;
    }
    .window-title img { width: 16px; height: 16px; object-fit: contain; }

    .window-controls { display: flex; height: 100%; }
    .win-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #000;
      cursor: pointer;
      transition: background 0.1s;
      touch-action: manipulation;
    }
    .win-btn:hover { background: rgba(0,0,0,0.08); }
    .win-btn.close:hover { background: #e81123; color: #fff; }
    
    /* Maximize Icon specific */
    .win-btn img { width: 12px; height: 12px; filter: brightness(0); }
    .win-btn.close:hover img { filter: brightness(0) invert(1); }

    .window-body {
      flex: 1;
      overflow: auto;
      padding: 16px;
      color: var(--win-text);
      font-size: 14px;
      line-height: 1.55;
      -webkit-overflow-scrolling: touch;
      background: #ffffff;
    }

    /* ================================================================
       APP-SPECIFIC STYLES
       ================================================================ */
    .explorer-layout { display: flex; gap: 0; height: 100%; color: #333; }
    .explorer-nav {
      width: 190px; flex-shrink: 0; border-right: 1px solid #e0e0e0;
      padding-right: 10px; overflow-y: auto;
    }
    .explorer-nav-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px;
      border-radius: 5px; font-size: 12px; color: #555;
      cursor: pointer; transition: background 0.1s;
    }
    .explorer-nav-item:hover { background: rgba(0,0,0,0.05); color: #000; }
    .explorer-nav-item.active { background: rgba(0, 103, 192, 0.1); color: var(--accent); }
    .explorer-nav-item i { width: 16px; text-align: center; font-size: 13px; }
    .explorer-content { flex: 1; padding-left: 16px; overflow-y: auto; }
    .explorer-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 6px;
    }
    .explorer-folder {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      padding: 14px 6px; border-radius: 6px; cursor: pointer;
      transition: background 0.1s; text-align: center;
    }
    .explorer-folder:hover { background: rgba(0,0,0,0.05); }
    .explorer-folder:active { background: rgba(0,0,0,0.1); transform: scale(0.95); }
    .explorer-folder img { width: 40px; height: 40px; object-fit: contain; }
    .explorer-folder span { font-size: 11px; color: #333; }

    /* Drive Bar */
    .drive-container {
      display: flex; align-items: flex-start; gap: 12px; padding: 10px;
      border-radius: 6px; cursor: pointer; transition: background 0.1s;
      width: 240px;
    }
    .drive-container:hover { background: rgba(0,0,0,0.05); }
    .drive-info { flex: 1; }
    .drive-name { font-size: 12px; font-weight: 600; color: #000; margin-bottom: 4px; }
    .drive-bar-bg {
      width: 100%; height: 14px; background: #e0e0e0;
      border: 1px solid #ccc; border-radius: 2px; overflow: hidden;
    }
    .drive-bar-fill { height: 100%; background: #0078D7; width: 46%; }
    .drive-subtext { font-size: 11px; color: #555; margin-top: 4px; }

    .terminal-body {
      background: #0c0c0c; color: #cccccc; font-family: 'Cascadia Code', 'Consolas', monospace;
      height: 100%; padding: 16px; border-radius: 6px; font-size: 13px; line-height: 1.5;
      overflow-y: auto;
    }
    .terminal-line { white-space: pre-wrap; word-break: break-all; }
    .terminal-prompt { color: #4cc2ff; }
    .terminal-input-line { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .terminal-input-line input {
      background: transparent; border: none; outline: none; color: #cccccc;
      font-family: inherit; font-size: 13px; flex: 1; caret-color: #4cc2ff;
    }

    .browser-bar {
      display: flex; align-items: center; gap: 6px; padding: 8px 12px;
      border-bottom: 1px solid #e0e0e0; flex-shrink: 0; background: #f9f9f9;
    }
    .browser-bar img { width: 16px; height: 16px; cursor: pointer; opacity: 0.65; }
    .browser-bar img:hover { opacity: 1; }
    .browser-url {
      flex: 1; background: #fff; border: 1px solid #ccc; border-radius: 18px;
      padding: 6px 14px; color: #000; font-size: 12px; outline: none;
    }
    
    .notepad-menubar {
      display: flex; gap: 2px; padding: 5px 12px;
      border-bottom: 1px solid #e0e0e0; flex-shrink: 0; background: #f9f9f9;
    }
    .notepad-menubar span {
      font-size: 12px; padding: 3px 10px; border-radius: 4px;
      cursor: pointer; color: #555;
    }
    .notepad-menubar span:hover { background: rgba(0,0,0,0.05); color: #000; }
    .notepad-textarea {
      flex: 1; background: #fff; border: none; outline: none; resize: none;
      padding: 14px; color: #000; font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 14px; line-height: 1.6;
    }

    .settings-section { padding: 12px 16px; border-bottom: 1px solid #eee; color: #333; }
    .settings-section h4 { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #000; }
    .settings-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; font-size: 12px; color: #555;
    }
    
    .calc-display {
      background: #f0f0f0; border-radius: 6px; padding: 18px; text-align: right;
      font-size: 34px; font-weight: 300; color: #000; margin-bottom: 10px; min-height: 66px;
    }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .calc-btn {
      padding: 15px 0; border-radius: 5px; border: none; background: #f9f9f9;
      color: #000; font-size: 17px; cursor: pointer; font-family: inherit;
      transition: background 0.1s; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .calc-btn:hover { background: #e5e5e5; }
    .calc-btn:active { background: #d5d5d5; }
    .calc-btn.accent { background: var(--accent); color: #fff; }

    .photos-grid { display: flex; gap: 10px; flex-wrap: wrap; }
    .photos-grid div {
      width: 110px; height: 90px; border-radius: 6px; display: flex;
      align-items: center; justify-content: center; color: #fff; font-size: 26px;
      opacity: 0.85;
    }

    .store-layout { display: flex; height: 100%; background: #fff; }
    .store-sidebar {
      width: 60px; background: #f0f0f0; display: flex; flex-direction: column;
      align-items: center; padding: 12px 0; gap: 20px;
    }
    .store-sidebar i { font-size: 18px; color: #555; cursor: pointer; }
    .store-sidebar i.active { color: var(--accent); }
    .store-content { flex: 1; padding: 24px; }
    .store-card {
      border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px;
      width: 140px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .store-card img { width: 48px; margin-bottom: 12px; }
    .store-card .title { font-size: 13px; font-weight: 600; color: #000; }
    .store-card .price { font-size: 11px; color: #555; margin-top: 4px; }

    /* ================================================================
       RESPONSIVE
       ================================================================ */
    @media (max-width: 720px) {
      :root { --taskbar-h: 46px; }
      .start-apps { grid-template-columns: repeat(4, 1fr); }
      .taskbar-tray .tray-item:not(.tray-clock) { display: none; }

<script>
/* ================================================================
   INDEXEDDB SETUP
   ================================================================ */
let db;
const dbRequest = indexedDB.open("index.db", 1);
dbRequest.onupgradeneeded = (e) => {
  db = e.target.result;
  if (!db.objectStoreNames.contains('state')) db.createObjectStore('state');
};
dbRequest.onsuccess = (e) => {
  db = e.target.result;
  loadState();
};

function saveState() {
  if (!db) return;
  const tx = db.transaction('state', 'readwrite');
  const store = tx.objectStore('state');
  const win = document.getElementById('appWindow');
  store.put({
    winLeft: win.style.left,
    winTop: win.style.top,
    winOpen: win.classList.contains('open'),
    currentApp: currentApp
  }, 'windowState');
}

function loadState() {
  if (!db) return;
  const tx = db.transaction('state', 'readonly');
  const store = tx.objectStore('state');
  const req = store.get('windowState');
  
  req.onsuccess = () => {
    const state = req.result;
    if (state && state.winOpen && state.currentApp) {
      setTimeout(() => {
        openApp(state.currentApp);
        const win = document.getElementById('appWindow');
        if (state.winLeft) {
          win.style.transition = 'none';
          win.style.transform = 'none';
          win.style.left = state.winLeft;
          win.style.top = state.winTop;
        }
      }, 1900); 
    }
  };
}

/* ================================================================
   RENDER UI
   ================================================================ */
function buildUI() {
  let taskbarHTML = '';
  TASKBAR_KEYS.forEach(item => {
    taskbarHTML += `
      <div class="taskbar-icon" data-app="${item.key}" title="${item.label}">
        <img src="${item.img}" alt="${item.label}" draggable="false">
      </div>`;
    
    if (item.key === 'start') {
      taskbarHTML += `
        <div class="taskbar-search" onclick="document.getElementById('searchInput').focus()">
          <img src="https://img.icons8.com/fluency-systems-filled/48/search.png" alt="Search">
          <input type="text" id="searchInput" placeholder="Search" onkeydown="handleSearch(event)">
        </div>
      `;
    }
  });
  document.getElementById('taskbarCenter').innerHTML = taskbarHTML;

  document.getElementById('startApps').innerHTML = START_KEYS.map(key => {
    const icon = ICONS[key];
    if (!icon) return '';
    return `
      <div class="start-app-item" data-app="${key}">
        <img src="${icon.img}" alt="${icon.label}" draggable="false">
        <span>${icon.label}</span>
      </div>`;
  }).join('');
}

/* ================================================================
   SEARCH LOGIC
   ================================================================ */
function handleSearch(e) {
  if (e.key === 'Enter') {
    const query = e.target.value.trim();
    if (query) {
      e.target.value = '';
      openApp('edge');
      setTimeout(() => {
        const iframe = document.querySelector('.window-body iframe');
        if (iframe) iframe.src = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
      }, 100);
    }
  }
}

/* ================================================================

      el.classList.toggle('active-app', el.dataset.app === key);

function minimizeApp() {
  winEl.classList.remove('open');
  saveState();
}

function closeApp() {
  winEl.classList.remove('open');
  currentApp = null;
  document.querySelectorAll('.taskbar-icon').forEach(el => el.classList.remove('active-app'));
  saveState();
}

/* ================================================================
   TERMINAL LOGIC
   ================================================================ */
function initTerminal() {
  const input = document.getElementById('terminalInput');
  const body = document.getElementById('terminalBody');
  if (!input || !body) return;

  input.focus();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const cmd = input.value.trim();
      const line = document.createElement('div');
      line.className = 'terminal-line';
      line.innerHTML = `<span class="terminal-prompt">C:\\Users\\User&gt;</span> ${cmd}`;
      body.insertBefore(line, body.lastElementChild);

      const resp = document.createElement('div');
      resp.className = 'terminal-line';

      if (cmd.toLowerCase() === 'dir') {
        resp.textContent = '  Directory of C:\\Users\\User\n\n03/15/2025  10:24 AM    <DIR>          Desktop\n03/15/2025  10:24 AM    <DIR>          Documents\n03/15/2025  10:24 AM    <DIR>          Downloads';
      } else if (cmd.toLowerCase() === 'cls') {
        body.querySelectorAll('.terminal-line').forEach((l, i) => { if (i > 2) l.remove(); });
        resp.textContent = '';
      } else if (cmd.toLowerCase().startsWith('echo ')) {
        resp.textContent = cmd.slice(5);
      } else if (cmd === '') {
        resp.textContent = '';
      } else {
        resp.textContent = `'${cmd}' is not recognized as an internal or external command.`;
      }

      if (resp.textContent) body.insertBefore(resp, body.lastElementChild);
      input.value = '';
      body.scrollTop = body.scrollHeight;
    }
  });
}

/* ================================================================
   SYSTEM TRAY FLYOUT
   ================================================================ */
const trayFlyout = document.getElementById('trayFlyout');
const flyoutTitle = document.getElementById('flyoutTitle');
const flyoutContent = document.getElementById('flyoutContent');

function closeFlyout() {
  trayFlyout.classList.remove('open');
}

document.querySelectorAll('.tray-item, .tray-clock').forEach(item => {
  item.addEventListener('click', (e) => {
    e.stopPropagation();
    const type = item.dataset.tray;
    
    if (trayFlyout.classList.contains('open') && trayFlyout.dataset.active === type) {
      closeFlyout();
      return;
    }
    
    trayFlyout.dataset.active = type;
    flyoutContent.innerHTML = '';
    
    if (type === 'update') {
      flyoutTitle.textContent = 'Hidden Icons';
      flyoutContent.innerHTML = `<div class="flyout-row"><span>No hidden icons</span></div>`;
    } else if (type === 'sync') {
      flyoutTitle.textContent = 'Sync Center';
      flyoutContent.innerHTML = `
        <div class="flyout-row"><span>Sync is active</span><i class="fas fa-sync" style="color:var(--accent);"></i></div>
        <div class="flyout-row" style="font-size:11px; color:#888; margin-top:4px;">No conflicts found.</div>
      `;
    } else if (type === 'onedrive') {
      flyoutTitle.textContent = 'OneDrive';
      flyoutContent.innerHTML = `
        <div class="flyout-row"><span>Files are up to date</span><i class="fas fa-cloud" style="color:var(--accent);"></i></div>
        <div class="flyout-row" style="font-size:11px; color:#888; margin-top:4px;">2.4 GB of 5 GB used</div>
      `;
    } else if (type === 'lang') {
      flyoutTitle.textContent = 'Language';
      flyoutContent.innerHTML = `
        <div class="flyout-row active"><span>English (ENG)</span><i class="fas fa-check"></i></div>
        <div class="flyout-row"><span>India (IN)</span></div>
      `;
    } else if (type === 'wifi') {
      flyoutTitle.textContent = 'Wi-Fi';
      flyoutContent.innerHTML = `
        <div class="flyout-row">
          <span>Wi-Fi</span>
          <div class="settings-toggle on" onclick="this.classList.toggle('on'); event.stopPropagation();"></div>
        </div>
        <div class="flyout-row" style="margin-top:6px; color:var(--accent); font-size:11px;">Available Networks:</div>
        <div class="flyout-row" style="font-size:11px;">Home_Network_5G</div>
      `;
    } else if (type === 'sound') {
      flyoutTitle.textContent = 'Sound';
      flyoutContent.innerHTML = `
        <div class="flyout-row"><span>Volume</span><span id="volText">75%</span></div>
        <input type="range" min="0" max="100" value="75" id="volSlider" style="width:100%; accent-color:var(--accent); cursor:pointer;" onclick="event.stopPropagation();">
      `;
      setTimeout(() => {
        const volSlider = document.getElementById('volSlider');
        const volText = document.getElementById('volText');
        if (volSlider && volText) {
          volSlider.addEventListener('input', (e) => { volText.textContent = e.target.value + '%'; });
        }
      }, 10);
    } else if (type === 'battery') {
      flyoutTitle.textContent = 'Battery';
      flyoutContent.innerHTML = `
        <div class="flyout-row"><span>87% remaining</span><i class="fas fa-battery-full" style="color:var(--accent);"></i></div>
        <div class="flyout-row">
          <span>Battery saver</span>
          <div class="settings-toggle" onclick="this.classList.toggle('on'); event.stopPropagation();"></div>
        </div>
      `;
    } else if (type === 'clock') {
      flyoutTitle.textContent = 'Calendar';
      flyoutContent.innerHTML = `
        <div class="flyout-row"><span>No new notifications</span></div>
        <div class="flyout-row" style="margin-top:6px; font-size:11px; color:var(--accent);">Open Calendar</div>
      `;
    }
    
    trayFlyout.classList.add('open');
  });
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.tray-item') && !e.target.closest('.tray-clock') && !e.target.closest('.tray-flyout')) {
    closeFlyout();
  }
});

/* ================================================================
   CONTEXT MENU & DRAG SELECTION
   ================================================================ */
const desktopSurface = document.getElementById('desktopSurface');
const selectionBox = document.getElementById('selection-box');
const contextMenu = document.getElementById('contextMenu');

desktopSurface.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (e.target.closest('.desktop-icon')) return;
  contextMenu.style.display = 'block';
  contextMenu.style.left = e.pageX + 'px';
  contextMenu.style.top = e.pageY + 'px';
});

function closeContextMenu() { contextMenu.style.display = 'none'; }

document.addEventListener('click', (e) => {
  if (!e.target.closest('.context-menu')) closeContextMenu();
});

document.querySelectorAll('.desktop-icon').forEach(icon => {
  icon.addEventListener('dblclick', () => openApp(icon.dataset.app));
  icon.addEventListener('click', (e) => {
    document.querySelectorAll('.desktop-icon').forEach(i => i.style.background = 'transparent');
    icon.style.background = 'rgba(0,0,0,0.1)';
  });
});

let isSelecting = false;
let selStartX = 0, selStartY = 0;

desktopSurface.addEventListener('mousedown', (e) => {
  if (e.target !== desktopSurface) return;
  isSelecting = true;
  selStartX = e.clientX; selStartY = e.clientY;
  selectionBox.style.left = selStartX + 'px'; selectionBox.style.top = selStartY + 'px';
  selectionBox.style.width = '0px'; selectionBox.style.height = '0px';
  selectionBox.style.display = 'block';
  closeContextMenu();
});

document.addEventListener('mousemove', (e) => {
  if (!isSelecting) return;
  const currentX = e.clientX; const currentY = e.clientY;
  const width = Math.abs(currentX - selStartX); const height = Math.abs(currentY - selStartY);
  const left = Math.min(currentX, selStartX); const top = Math.min(currentY, selStartY);
  selectionBox.style.left = left + 'px'; selectionBox.style.top = top + 'px';
  selectionBox.style.width = width + 'px'; selectionBox.style.height = height + 'px';
});

document.addEventListener('mouseup', () => {
  if (isSelecting) {
    isSelecting = false;
    setTimeout(() => { selectionBox.style.display = 'none'; }, 100);
  }
});

let startX = 0, startY = 0, currentX = 0, currentY = 0;
let isSwiping = false;

desktopSurface.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  currentX = startX; currentY = startY; isSwiping = false;
  if (e.target === desktopSurface) {
    isSelecting = true; selStartX = startX; selStartY = startY;
    selectionBox.style.left = selStartX + 'px'; selectionBox.style.top = selStartY + 'px';
    selectionBox.style.width = '0px'; selectionBox.style.height = '0px';
    selectionBox.style.display = 'block'; closeContextMenu();
  }
}, { passive: true });

desktopSurface.addEventListener('touchmove', e => {
  if (e.touches.length !== 1) return;
  currentX = e.touches[0].clientX; currentY = e.touches[0].clientY;
  const dx = currentX - startX; const dy = currentY - startY;
  if (!isSwiping && Math.abs(dx) > 22 && Math.abs(dx) > Math.abs(dy)) {
    isSwiping = true;
    if (isSelecting) { isSelecting = false; selectionBox.style.display = 'none'; }
  }
  if (isSelecting) {
    const width = Math.abs(currentX - selStartX); const height = Math.abs(currentY - selStartY);
    const left = Math.min(currentX, selStartX); const top = Math.min(currentY, selStartY);
    selectionBox.style.left = left + 'px'; selectionBox.style.top = top + 'px';
    selectionBox.style.width = width + 'px'; selectionBox.style.height = height + 'px';
  }
}, { passive: true });

desktopSurface.addEventListener('touchend', e => {
  if (isSelecting) { isSelecting = false; setTimeout(() => { selectionBox.style.display = 'none'; }, 100); }
  const dx = currentX - startX; const dy = currentY - startY;
  if (isSwiping && Math.abs(dx) > 60) {
    if (dx > 0) {
      if (!startMenu.classList.contains('open')) { startMenu.classList.add('open'); desktop.classList.add('blurred'); }
    } else {
      if (winEl.classList.contains('open')) minimizeApp();
      else if (startMenu.classList.contains('open')) { startMenu.classList.remove('open'); desktop.classList.remove('blurred'); }
    }
    return;
  }
});

desktopSurface.addEventListener('click', (e) => {
  if (!e.target.closest('.desktop-icon')) {
    startMenu.classList.remove('open'); desktop.classList.remove('blurred'); closeFlyout();
    document.querySelectorAll('.desktop-icon').forEach(i => i.style.background = 'transparent');
  }
});

/* ================================================================
   TASKBAR & START MENU EVENTS
   ================================================================ */
document.getElementById('taskbarCenter').addEventListener('click', e => {
  const icon = e.target.closest('.taskbar-icon');
  if (!icon) return;
  const appKey = icon.dataset.app;

  if (appKey === 'start') {
    const isOpen = startMenu.classList.contains('open');
    startMenu.classList.toggle('open');
    desktop.classList.toggle('blurred', !isOpen);
    return;
  }

  openApp(appKey);
});

document.getElementById('startApps').addEventListener('click', e => {
  const app = e.target.closest('.start-app-item');
  if (!app) return;
  openApp(app.dataset.app);
});

/* ================================================================
   WINDOW CONTROLS
   ================================================================ */
document.getElementById('winClose').addEventListener('click', closeApp);
document.getElementById('winMinimize').addEventListener('click', minimizeApp);
document.getElementById('winMaximize').addEventListener('click', () => {
  if (winEl.style.width === '96vw') {
    winEl.style.width = 'min(840px, 92vw)'; winEl.style.height = 'min(560px, 74vh)';
    winEl.style.top = '50%'; winEl.style.left = '50%';
    winEl.style.transform = 'translate(-50%, -50%) scale(1)';
  } else {
    winEl.style.width = '96vw'; winEl.style.height = 'calc(100vh - 56px - 16px)';
    winEl.style.top = '8px'; winEl.style.left = '2vw';
    winEl.style.transform = 'none';
  }
  saveState();
});

(function initDrag() {
  const header = document.getElementById('windowHeader');
  const win = document.getElementById('appWindow');
  let isDragging = false, offsetX = 0, offsetY = 0;

  function startDrag(e) {
    if (e.target.closest('.win-btn')) return;
    if (win.style.width === '96vw') return;
    isDragging = true;
    const rect = win.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    offsetX = clientX - rect.left; offsetY = clientY - rect.top;
    win.style.transition = 'none'; win.style.transform = 'none';
    win.style.left = rect.left + 'px'; win.style.top = rect.top + 'px';
  }

  function moveDrag(e) {
    if (!isDragging) return;
    e.preventDefault();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    let newX = clientX - offsetX; let newY = clientY - offsetY;
    newX = Math.max(0, Math.min(window.innerWidth - win.offsetWidth, newX));
    newY = Math.max(0, Math.min(window.innerHeight - win.offsetHeight - 56, newY));
    win.style.left = newX + 'px'; win.style.top = newY + 'px';
  }

  function endDrag() {
    if (!isDragging) return;
    isDragging = false; win.style.transition = ''; saveState();
  }

  header.addEventListener('mousedown', startDrag);
  document.addEventListener('mousemove', moveDrag);
  document.addEventListener('mouseup', endDrag);
  header.addEventListener('touchstart', startDrag, { passive: false });
  document.addEventListener('touchmove', moveDrag, { passive: false });
  document.addEventListener('touchend', endDrag);
})();

/* ================================================================
   CLOCK (Format: DD-MM-YYYY, 24H, Same Font)
   ================================================================ */
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  const day = String(now.getDate()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const year = now.getFullYear();
  const date = `${day}-${month}-${year}`;
  
  document.getElementById('trayTime').textContent = time;
  document.getElementById('trayDate').textContent = date;
}
setInterval(updateClock, 1000);
updateClock();

// Boot sequence & Audio
window.addEventListener('load', () => {
  buildUI();
  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hidden');
    const startupSound = new Audio('https://files.catbox.moe/a6tds4.mp3');
    startupSound.play().catch(e => console.log('Audio playback blocked by browser policy:', e));
  }, 1800);
});

// Prevent context menu on long press globally (except custom context menu)
document.addEventListener('contextmenu', e => {
  if (!e.target.closest('#desktopSurface')) e.preventDefault();
});

// Prevent image drag
document.querySelectorAll('img').forEach(img => {
  img.addEventListener('dragstart', e => e.preventDefault());
});

// Escape closes window / menu
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (winEl.classList.contains('open')) minimizeApp();
    else if (startMenu.classList.contains('open')) { startMenu.classList.remove('open'); desktop.classList.remove('blurred'); }
    closeFlyout(); closeContextMenu();
  }
});
</script>
